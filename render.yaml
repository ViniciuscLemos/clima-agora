# Render config (Blueprint): a single service that builds React and starts Express.
# Express serves the site and the API at the same address.
services:
  - type: web
    name: weather-now
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      # optional: without the key the app uses Open-Meteo, which needs no key
      - key: OPENWEATHER_API_KEY
        sync: false
