name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Server and front end tests
        run: npm test
      - name: Front end build
        run: npm run build
      # the api is mocked in the tests, so no key or internet is needed here
      - name: End to end tests
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
